<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitBite — Fotoğrafını çek, kalorini bil</title>
  <meta name="description" content="Yemeğinin fotoğrafını çek, yapay zeka kalori ve makrolarını saniyeler içinde hesaplasın. Apple Health entegrasyonu, AI diyet koçu ve XP sistemiyle kalori takibi hiç bu kadar kolay olmamıştı." />
  <meta property="og:title" content="FitBite — Snap your meal. Know your calories." />
  <meta property="og:description" content="AI-powered calorie tracking with Apple Health sync, diet coaching and gamified progress." />
  <meta property="og:url" content="https://fitbite.dev" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0C0C10;
      --bg-soft: #121218;
      --card: #17171F;
      --border: #26262E;
      --primary: #6366F1;
      --primary-light: #818CF8;
      --primary-dark: #4F46E5;
      --primary-soft: #2A1F3F;
      --accent: #26C6A4;
      --accent-light: #5EE6C9;
      --accent-soft: #0E2F26;
      --orange: #FFB74D;
      --red: #FF6B6B;
      --cyan: #4DD0E1;
      --text: #FFFFFF;
      --text-2: #B3B3B8;
      --text-3: #8E8E93;
      --radius: 20px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

    /* ambient glow */
    .glow {
      position: fixed; pointer-events: none; z-index: 0;
      width: 640px; height: 640px; border-radius: 50%;
      filter: blur(140px); opacity: .22;
    }
    .glow-1 { background: var(--primary); top: -220px; left: -160px; }
    .glow-2 { background: var(--accent); top: 30%; right: -260px; opacity: .12; }

    /* ---------- NAV ---------- */
    nav {
      position: sticky; top: 0; z-index: 50;
      backdrop-filter: blur(16px);
      background: rgba(12,12,16,.72);
      border-bottom: 1px solid var(--border);
    }
    .nav-in { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -.4px; color: var(--text); text-decoration: none; }
    .brand img { width: 32px; height: 32px; border-radius: 9px; }
    .nav-links { display: flex; align-items: center; gap: 26px; }
    .nav-links a { color: var(--text-2); text-decoration: none; font-size: 14px; font-weight: 600; transition: color .2s; }
    .nav-links a:hover { color: var(--text); }
    .lang-btn {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      font: inherit; font-size: 13px; font-weight: 700; padding: 7px 14px;
      border-radius: 999px; cursor: pointer; transition: border-color .2s;
    }
    .lang-btn:hover { border-color: var(--primary); }

    /* ---------- HERO ---------- */
    .hero { position: relative; z-index: 1; padding: 84px 0 60px; display: grid; grid-template-columns: 1.05fr .95fr; gap: 48px; align-items: center; }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--primary-soft); color: var(--primary-light);
      border: 1px solid rgba(129,140,248,.25);
      font-size: 13px; font-weight: 700; padding: 7px 16px; border-radius: 999px;
      margin-bottom: 22px;
    }
    .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.8s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    h1 { font-size: clamp(38px, 5.2vw, 58px); font-weight: 900; letter-spacing: -1.8px; line-height: 1.08; }
    h1 .grad {
      background: linear-gradient(92deg, var(--primary-light), var(--accent-light));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero p.sub { color: var(--text-2); font-size: 17px; max-width: 480px; margin: 20px 0 32px; }

    /* waitlist form */
    .waitlist { display: flex; gap: 10px; max-width: 460px; }
    .waitlist input {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      color: var(--text); font: inherit; font-size: 15px;
      padding: 14px 18px; border-radius: 14px; outline: none; transition: border-color .2s;
    }
    .waitlist input:focus { border-color: var(--primary); }
    .waitlist button {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff; border: 0; font: inherit; font-size: 15px; font-weight: 700;
      padding: 14px 24px; border-radius: 14px; cursor: pointer; white-space: nowrap;
      transition: transform .15s, box-shadow .2s;
      box-shadow: 0 8px 24px rgba(99,102,241,.35);
    }
    .waitlist button:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(99,102,241,.45); }
    .form-msg { font-size: 13px; font-weight: 600; margin-top: 12px; min-height: 20px; }
    .form-msg.ok { color: var(--accent-light); }
    .form-msg.err { color: var(--red); }
    .hero-note { display: flex; gap: 18px; margin-top: 26px; color: var(--text-3); font-size: 13px; font-weight: 600; }
    .hero-note span { display: flex; align-items: center; gap: 6px; }

    /* ---------- PHONE MOCKUP ---------- */
    .phone-col { display: flex; justify-content: center; }
    .phone {
      width: 300px; background: #101014;
      border: 3px solid #2A2A32; border-radius: 46px;
      padding: 14px; box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(129,140,248,.08);
      position: relative; transform: rotate(0deg);
    }
    .notch { width: 110px; height: 26px; background: #000; border-radius: 999px; margin: 2px auto 12px; }
    .screen { padding: 4px 8px 12px; }
    .scr-greet { font-size: 12px; color: var(--text-3); font-weight: 600; }
    .scr-title { font-size: 17px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 14px; }
    .ring-wrap { display: flex; justify-content: center; position: relative; margin-bottom: 6px; }
    .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .ring-num { font-size: 30px; font-weight: 900; letter-spacing: -1px; }
    .ring-lbl { font-size: 10px; color: var(--text-3); font-weight: 600; }
    .ring svg { transform: rotate(-90deg); }
    .ring .track { stroke: #232330; }
    .ring .prog { stroke: url(#ringGrad); stroke-linecap: round; stroke-dasharray: 427; stroke-dashoffset: 427; animation: ring 1.6s .4s cubic-bezier(.22,.8,.35,1) forwards; }
    @keyframes ring { to { stroke-dashoffset: 148; } }
    .bonus-pill {
      display: flex; align-items: center; justify-content: center; gap: 5px;
      background: var(--accent-soft); color: var(--accent-light);
      font-size: 11px; font-weight: 700; border-radius: 999px;
      padding: 5px 12px; width: fit-content; margin: 0 auto 14px;
    }
    .macro { margin-bottom: 9px; }
    .macro-head { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 700; margin-bottom: 4px; }
    .macro-head .lbl { color: var(--text-2); }
    .macro-track { height: 6px; border-radius: 3px; background: #232330; overflow: hidden; }
    .macro-fill { height: 100%; border-radius: 3px; width: 0; animation: fill 1.2s .8s ease forwards; }
    @keyframes fill { to { width: var(--w); } }
    .scr-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 12px; margin-top: 12px;
    }
    .scr-card-title { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; margin-bottom: 8px; }
    .steps-row { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 700; margin-bottom: 4px; }
    .steps-row .goal { color: var(--text-3); }
    .mini-metrics { display: flex; gap: 6px; margin-top: 10px; }
    .mini-metric {
      flex: 1; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px;
      padding: 7px 4px; text-align: center;
    }
    .mini-metric .v { font-size: 12px; font-weight: 800; }
    .mini-metric .k { font-size: 8.5px; color: var(--text-3); font-weight: 600; }

    /* ---------- SECTIONS ---------- */
    section { position: relative; z-index: 1; padding: 76px 0; }
    .sec-head { text-align: center; max-width: 620px; margin: 0 auto 52px; }
    .sec-kicker { color: var(--primary-light); font-size: 13px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
    .sec-head h2 { font-size: clamp(28px, 3.6vw, 40px); font-weight: 900; letter-spacing: -1px; margin: 10px 0 12px; }
    .sec-head p { color: var(--text-2); font-size: 16px; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .feature {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 26px 24px; transition: transform .2s, border-color .2s;
    }
    .feature:hover { transform: translateY(-4px); border-color: rgba(129,140,248,.4); }
    .feature .ico {
      width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
      font-size: 22px; margin-bottom: 16px; background: var(--primary-soft);
    }
    .feature.acc .ico { background: var(--accent-soft); }
    .feature h3 { font-size: 16.5px; font-weight: 800; letter-spacing: -.3px; margin-bottom: 8px; }
    .feature p { color: var(--text-2); font-size: 14px; }

    /* how it works */
    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; counter-reset: step; }
    .step { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 24px; position: relative; }
    .step .num {
      width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      font-weight: 800; font-size: 15px; margin-bottom: 16px;
    }
    .step h3 { font-size: 16.5px; font-weight: 800; margin-bottom: 8px; }
    .step p { color: var(--text-2); font-size: 14px; }

    /* CTA band */
    .cta-band {
      background: linear-gradient(135deg, rgba(99,102,241,.16), rgba(38,198,164,.10));
      border: 1px solid rgba(129,140,248,.25); border-radius: 28px;
      padding: 56px 32px; text-align: center;
    }
    .cta-band h2 { font-size: clamp(26px, 3.2vw, 36px); font-weight: 900; letter-spacing: -.8px; margin-bottom: 10px; }
    .cta-band p { color: var(--text-2); margin-bottom: 26px; }
    .cta-band .waitlist { margin: 0 auto; }

    footer { border-top: 1px solid var(--border); padding: 34px 0 44px; position: relative; z-index: 1; }
    .foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .foot .brand img { width: 26px; height: 26px; }
    .foot .brand { font-size: 15px; }
    .foot-meta { color: var(--text-3); font-size: 13px; }
    .foot a { color: var(--text-2); text-decoration: none; font-size: 13px; font-weight: 600; }
    .foot a:hover { color: var(--text); }

    /* reveal */
    .rv { opacity: 0; transform: translateY(22px); transition: opacity .6s ease, transform .6s ease; }
    .rv.in { opacity: 1; transform: none; }

    @media (max-width: 880px) {
      .hero { grid-template-columns: 1fr; padding-top: 52px; text-align: center; }
      .hero p.sub { margin-left: auto; margin-right: auto; }
      .waitlist { margin: 0 auto; }
      .hero-note { justify-content: center; }
      .grid, .steps { grid-template-columns: 1fr; }
      .nav-links a[data-nav] { display: none; }
    }
    @media (max-width: 480px) {
      .waitlist { flex-direction: column; }
      .phone { width: 270px; }
    }
  </style>
</head>

  <nav>

    var lang = localStorage.getItem('fitbite_lang')
      || ((navigator.language || 'en').toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en');

    function applyLang() {
      var d = I[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var k = el.getAttribute('data-i18n');
        if (d[k] != null) el.textContent = d[k];
      });
      document.querySelectorAll('[data-i18n-ph]').forEach(function (el) {
        var k = el.getAttribute('data-i18n-ph');
        if (d[k] != null) el.setAttribute('placeholder', d[k]);
      });
      document.getElementById('langBtn').textContent = lang === 'tr' ? 'EN' : 'TR';
      document.title = lang === 'tr'
        ? 'FitBite — Fotoğrafını çek, kalorini bil'
        : 'FitBite — Snap your meal. Know your calories.';
    }
    document.getElementById('langBtn').addEventListener('click', function () {
      lang = lang === 'tr' ? 'en' : 'tr';
      localStorage.setItem('fitbite_lang', lang);
      applyLang();
    });
    applyLang();

    // ================== waitlist submit ==================
    function bindForm(formId, emailId, msgId) {
      var form = document.getElementById(formId);
      var msg = document.getElementById(msgId);
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = document.getElementById(emailId).value.trim();
        msg.className = 'form-msg';
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          msg.textContent = I[lang].err_msg; msg.classList.add('err'); return;
        }
        if (FORMSPREE_ENDPOINT.indexOf('YOUR_FORM_ID') !== -1) {
          // Formspree henüz bağlanmadı — e-posta istemcisine düş.
          window.location.href = 'mailto:hello@fitbite.dev?subject=FitBite%20waitlist&body=' + encodeURIComponent(email);
          return;
        }
        fetch(FORMSPREE_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ email: email }),
        }).then(function (r) {
          if (r.ok) { msg.textContent = I[lang].ok_msg; msg.classList.add('ok'); form.reset(); }
          else { msg.textContent = I[lang].err_msg; msg.classList.add('err'); }
        }).catch(function () {
          msg.textContent = I[lang].err_msg; msg.classList.add('err');
        });
      });
    }
    bindForm('waitlistForm', 'wlEmail', 'formMsg');
    bindForm('waitlistForm2', 'wlEmail2', 'formMsg2');

    // ================== reveal on scroll ==================
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
    }, { threshold: 0.12 });
    document.querySelectorAll('.rv').forEach(function (el) { io.observe(el); });
  </script>
